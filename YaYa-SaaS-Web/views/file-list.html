<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        /* 分页页码显示 伪类 */
        .layui-laypage a:hover{
            color: #409eff;
        }
        /* 下拉框圆角 */
        .layui-form-select .layui-input{
            border-radius: 5px;
        }
        /* 弹出层圆角 */
        .layui-layer{
            border-radius: 10px;
        }
        /* 单选框颜色 */
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #409eff;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <form class="layui-form" style="padding: 10px 0;">
                <div class="layui-row">
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">地址</label>
                        <div class="yaya-input-block">
                            <input type="text" name="fileServerUrl" placeholder="文件服务地址" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-col-md4 layui-col-sm4 yaya-form-item">
                        <button type="button" class="yaya-btn yaya-primary" lay-submit lay-filter="search"><i class="iconfont icon-CRMEB-sousuo-xianxing" style="padding-right: 5px;"></i> 搜索</button>
                        <button type="reset" class="yaya-btn" style="margin-left: 10px;"><i class="iconfont icon-CRMEB-shuaxin1" style="padding-right: 5px;"></i> 重置</button>
                        <!-- 上传按钮(有权限才显示,弹窗选择图片/视频/文件) -->
                        <button type="button" id="upload-btn" class="yaya-btn yaya-primary" style="margin-left: 10px;display:none;"><i class="iconfont icon-CRMEB-tianjiawenjian-xianxing" style="padding-right: 5px;"></i> 上传</button>
                    </div>
                </div>
            </form>
        </div>
        <!-- 上传弹窗模板 -->
        <div id="upload-popup-tpl" style="display:none;">
            <form class="layui-form" style="padding: 20px 20px 0;">
                <div class="layui-form-item">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="uploadType" value="image" title="图片" checked lay-filter="uploadType">
                        <input type="radio" name="uploadType" value="video" title="视频" lay-filter="uploadType">
                        <input type="radio" name="uploadType" value="file" title="文件" lay-filter="uploadType">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">文件</label>
                    <div class="layui-input-block">
                        <button type="button" id="popup-choose-btn" class="yaya-btn yaya-primary"><i class="iconfont icon-CRMEB-xuanzewenjian-xianxing" style="padding-right: 5px;"></i>选择文件</button>
                        <span id="popup-upload-name" style="margin-left: 10px;color:#666;"></span>
                        <input type="file" id="popup-file-input" style="display:none;">
                    </div>
                </div>
                <div class="layui-form-item" id="popup-progress-item" style="display:none;">
                    <label class="layui-form-label">进度</label>
                    <div class="layui-input-block">
                        <div class="layui-progress layui-progress-big" lay-showPercent="yes" lay-filter="filter-popup">
                            <div class="layui-progress-bar" lay-percent=""></div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="yaya-panel" style="margin-top: 15px;padding: 5px;">
            <!-- 表格显示 -->
            <table class="layui-hide" id="table-file" lay-filter="table-file"></table>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const table = layui.table;
            const layer = layui.layer;
            const element = layui.element;

            //上传按钮权限控制
            if(is_super || hasPermission('file-add')){
                $("#upload-btn").show();
            }

            //搜索
            form.on('submit(search)', function(data){
                let field = data.field; // 获得表单字段
                // 执行搜索重载
                table.reload('table-file', {
                    page: {
                        curr: 1, // 重新从第 1 页开始
                        prev:'上一页',
                        next:'下一页',
                        limit:10,
                        limits:[10,20,30,40,50],
                        theme:'#409eff'
                    },
                    where: field // 搜索的字段
                });
                return false; // 阻止默认 form 跳转
            });

            //================ 弹窗上传 ================
            //当前弹窗选择的类型(图片/视频/文件)
            let popupUploadType = 'image';
            //弹窗层索引(用于上传成功后关闭弹窗)
            let uploadLayerIndex;
            //上传类型 -> 接口/允许的扩展名
            const uploadTypeConfig = {
                image: { url: server_url+'/uploadImage', exts: ['jpg','jpeg','png','gif'], name: '图片' },
                video: { url: server_url+'/uploadVideo', exts: ['mp4'], name: '视频' },
                file:  { url: server_url+'/uploadFile',  exts: ['zip','rar','mp3','mp4','pdf','doc','docx','xls','xlsx','ppt','pptx','txt'], name: '文件' }
            };

            //打开上传弹窗
            $("#upload-btn").click(function(){
                uploadLayerIndex = layer.open({
                    type: 1,
                    title: '上传',
                    area: ['480px', '280px'],
                    content: $('#upload-popup-tpl').html(),
                    success: function(){
                        form.render(); //渲染弹窗内的单选框
                    }
                });
            });

            //切换上传类型(全局监听一次)
            form.on('radio(uploadType)', function(data){
                popupUploadType = data.value;
                $("#popup-upload-name").text('');
            });

            //点击"选择文件" -> 触发隐藏的文件框
            $(document).on('click', '#popup-choose-btn', function(){
                $("#popup-file-input").click();
            });

            //选择文件后,按类型校验并上传
            $(document).on('change', '#popup-file-input', function(){
                let file = this.files[0];
                if(!file){
                    return;
                }
                let cfg = uploadTypeConfig[popupUploadType];
                //取扩展名
                let dot = file.name.lastIndexOf('.');
                let ext = dot > -1 ? file.name.substring(dot + 1).toLowerCase() : '';
                if(cfg.exts.indexOf(ext) === -1){
                    layer.msg('当前类型仅支持: ' + cfg.exts.join('/'));
                    this.value = '';
                    return;
                }
                //显示文件名和进度条
                $("#popup-upload-name").text(file.name);
                $("#popup-progress-item").show();
                element.progress('filter-popup', '0%');
                let uploadMsgIndex = layer.msg(cfg.name + '上传中...', {icon: 16, time: 0});
                //FormData上传
                let fd = new FormData();
                fd.append('file', file);
                $.ajax({
                    type: 'POST',
                    url: cfg.url,
                    data: fd,
                    processData: false,
                    contentType: false,
                    headers: {'Authorization': token},
                    xhr: function(){
                        let xhr = new XMLHttpRequest();
                        xhr.upload.addEventListener('progress', function(e){
                            if(e.lengthComputable){
                                let pct = Math.round(e.loaded / e.total * 100);
                                element.progress('filter-popup', pct + '%');
                            }
                        });
                        return xhr;
                    },
                    success: function(res){
                        layer.close(uploadMsgIndex);
                        $("#popup-progress-item").hide();
                        if(res.code===0){//成功
                            layer.msg('上传成功');
                            layer.close(uploadLayerIndex); //关闭弹窗
                            table.reload('table-file');    //刷新列表
                        }else{
                            layer.msg(res.msg, {icon: 5});
                        }
                    },
                    error: function(){
                        layer.close(uploadMsgIndex);
                        $("#popup-progress-item").hide();
                        layer.msg('上传失败,请重试', {icon: 5});
                    }
                });
            });

            //表格渲染
            table.render({
                elem: '#table-file',
                url: server_url+'/getFilePage',
                method:'POST',
                where:{
                    logType:1
                },
                headers:{
                    'Authorization':token
                },
                skin:'line',
                height:'full',
                parseData: function(res){
                    //console.log(res);
                    return {
                        "code" : res.code,
                        "msg"  : res.msg,
                        "data" : res.data.records,
                        "count": res.data.total
                    }
                },
                page:{
                    prev:'上一页',
                    next:'下一页',
                    limit:10,
                    limits:[10,20,30,40,50],
                    theme:'#409eff'
                },
                request: {
                    pageName: 'pageNo', // 页码的参数名称，默认：page
                    limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
                },
                cols: [[
                    {
                        title: '#',
                        type: 'numbers'
                    },
                    {
                        field:'fileName',
                        title: '文件名'
                    },
                    {
                        field:'deptName',
                        title: '部门'
                    },
                    {
                        field:'nickname',
                        title:'上传人'
                    },
                    {
                        field:'fileServerUrl',
                        title: '访问地址'
                    },
                    {
                        field:'createTime',
                        title: '上传时间'
                    }
                ]]
            })

        });
    </script>
</body>
</html>
