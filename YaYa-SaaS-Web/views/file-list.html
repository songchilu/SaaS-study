<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        /* 分页页码显示 伪类 */
        .layui-laypage a:hover{
            color: #409eff;
        }
        /* 下拉框圆角 */
        .layui-form-select .layui-input{
            border-radius: 5px;
        }
        /* 弹出层圆角 */
        .layui-layer{
            border-radius: 10px;
        }
        /* 单选框颜色 */
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #409eff;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <form class="layui-form" style="padding: 10px 0;">
                <div class="layui-row">
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">地址</label>
                        <div class="yaya-input-block">
                            <input type="text" name="fileServerUrl" placeholder="文件服务地址" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <button type="button" class="yaya-btn yaya-primary" lay-submit lay-filter="search"><i class="iconfont icon-CRMEB-sousuo-xianxing" style="padding-right: 5px;"></i> 搜索</button>
                        <button type="reset" class="yaya-btn" style="margin-left: 10px;"><i class="iconfont icon-CRMEB-shuaxin1" style="padding-right: 5px;"></i> 重置</button>
                        <!-- 上传文件按钮(有权限才显示) -->
                        <button type="button" id="upload-file-btn" class="yaya-btn yaya-primary" style="margin-left: 10px;display:none;"><i class="iconfont icon-CRMEB-tianjiawenjian-xianxing" style="padding-right: 5px;"></i> 上传文件</button>
                    </div>
                </div>
            </form>
        </div>
        <!-- 上传进度条 -->
        <div class="yaya-panel" style="margin-top: 15px;padding: 5px;display:none;" id="file-upload-progress-panel">
            <div class="layui-progress layui-progress-big" style="margin: 20px 0;" lay-showPercent="yes" lay-filter="filter-file">
                <div class="layui-progress-bar" lay-percent=""></div>
            </div>
        </div>
        <div class="yaya-panel" style="margin-top: 15px;padding: 5px;">
            <!-- 表格显示 -->
            <table class="layui-hide" id="table-file" lay-filter="table-file"></table>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const table = layui.table;
            const layer = layui.layer;
            const upload = layui.upload;
            const element = layui.element;

            //上传文件按钮权限控制
            if(is_super || hasPermission('file-add')){
                $("#upload-file-btn").show();
            }

            //搜索
            form.on('submit(search)', function(data){
                let field = data.field; // 获得表单字段
                // 执行搜索重载
                table.reload('table-file', {
                    page: {
                        curr: 1, // 重新从第 1 页开始
                        prev:'上一页',
                        next:'下一页',
                        limit:10,
                        limits:[10,20,30,40,50],
                        theme:'#409eff'
                    },
                    where: field // 搜索的字段
                });
                return false; // 阻止默认 form 跳转
            });


            //上传文件(非图片,支持zip/rar/pdf/office等,单文件最大500MB)
            let uploadMsgIndex;
            upload.render({
                elem: '#upload-file-btn',
                url: server_url+'/uploadFile',
                accept: 'file',
                exts: 'zip,rar,mp3,mp4,pdf,doc,docx,xls,xlsx,ppt,pptx,txt',
                headers: {'Authorization': token},
                before: function(){
                    //显示进度条并复位
                    $("#file-upload-progress-panel").show();
                    element.progress('filter-file', '0%');
                    uploadMsgIndex = layer.msg('文件上传中...', {icon: 16, time: 0});
                },
                progress: function(n){
                    let percent = n + '%'; // 获取进度百分比
                    element.progress('filter-file', percent);
                },
                done: function(res){
                    //隐藏进度条
                    $("#file-upload-progress-panel").hide();
                    layer.close(uploadMsgIndex);
                    if(res.code===0){//成功
                        layer.msg('上传成功');
                        //刷新列表
                        table.reload('table-file');
                    }else{
                        layer.msg(res.msg, {icon: 5});
                    }
                },
                error: function(){
                    //隐藏进度条
                    $("#file-upload-progress-panel").hide();
                    layer.close(uploadMsgIndex);
                    layer.msg('上传失败,请重试', {icon: 5});
                }
            });
            //表格渲染
            table.render({
                elem: '#table-file',
                url: server_url+'/getFilePage',
                method:'POST',
                where:{
                    logType:1
                },
                headers:{
                    'Authorization':token
                },
                skin:'line',
                height:'full',
                parseData: function(res){
                    //console.log(res);
                    return {
                        "code" : res.code,
                        "msg"  : res.msg,
                        "data" : res.data.records,
                        "count": res.data.total
                    }
                },
                page:{
                    prev:'上一页',
                    next:'下一页',
                    limit:10,
                    limits:[10,20,30,40,50],
                    theme:'#409eff'
                },
                request: {
                    pageName: 'pageNo', // 页码的参数名称，默认：page
                    limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
                },
                cols: [[
                    {
                        title: '#',
                        type: 'numbers'
                    },
                    {
                        field:'fileName',
                        title: '文件名'
                    },
                    {
                        field:'deptName',
                        title: '部门'
                    },
                    {
                        field:'nickname',
                        title:'上传人'
                    },
                    {
                        field:'fileServerUrl',
                        title: '访问地址'
                    },
                    {
                        field:'createTime',
                        title: '上传时间'
                    }
                ]]
            })

        });
    </script>
</body>
</html>
